<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="css/style.css" />
        <title>Previsão do Tempo</title>
    </head>
    <body>
        <div id="container">
            <form id="search">
                <i class="fa-solid fa-location-dot"></i>
                <input id="input" type="text" placeholder="Local desejado" />
                <button id="search-btn" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>

            <div id="weather">
                <h1 id="title">Guararapes, SP</h1>
                <div id="info">
                    <img
                        id="temp-img"
                        src="https://openweathermap.org/img/wn/04d@2x.png"
                        id="temp-img"
                    />
                    <div id="temp-info">
                        <p id="temp">24,1 <sup>°C</sup></p>
                        <p id="condition">Nublado</p>
                    </div>
                </div>
            </div>

            <div id="other-info">
                <div class="info">
                    <i
                        class="fa-solid fa-temperature-high"
                        id="temp-max-icon"
                    ></i>
                    <div>
                        <h3>Temp. máx</h3>
                        <p id="temp-max">28<sup>°C</sup></p>
                    </div>
                </div>

                <div class="info">
                    <i
                        class="fa-solid fa-temperature-low"
                        id="temp-min-icon"
                    ></i>
                    <div>
                        <h3>Temp. mín</h3>
                        <p id="temp-min">18<sup>°C</sup></p>
                    </div>
                </div>

                <div class="info">
                    <i class="fa-solid fa-droplet" id="humidity-icon"></i>
                    <div>
                        <h3>Humidade</h3>
                        <p id="humidity">18<sup>°C</sup></p>
                    </div>
                </div>

                <div class="info">
                    <i class="fa-solid fa-wind" id="wind-icon"></i>
                    <div>
                        <h3>Vento</h3>
                        <p id="wind">20 km/h</p>
                    </div>
                </div>
            </div>
            <div id="alert"></div>
        </div>

        <script type="module" src="js/script.js"></script>
    </body>
</html>
